[project]
name = "worth-reaching"
version = "0.1.0"
description = "Experiments on learned latent goals for long-horizon planning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
minigrid = ["gymnasium>=1.0,<2", "minigrid==3.2.0"]

[project.scripts]
wr = "worth_reaching.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
