[project]
name = "worth-reaching"
version = "0.1.0"
description = "Experiments on learned latent goals for long-horizon planning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
minigrid = ["gymnasium>=1.0,<2", "minigrid==3.2.0"]
craftax = ["craftax==1.7.0", "flax>=0.12,<1", "jax>=0.4.26,<1", "optax>=0.2,<1", "orbax-checkpoint>=0.12,<1"]
ogbench = ["ogbench==1.1.5", "mujoco==3.3.7", "flax>=0.12,<1", "jax>=0.4.26,<1", "optax>=0.2,<1"]
pointmaze = ["gymnasium-robotics==1.4.2", "minari[hdf5,hf]==0.5.4", "mujoco==3.3.7", "flax>=0.12,<1", "jax>=0.4.26,<1", "optax>=0.2,<1"]
cuda12 = ["jax[cuda12]>=0.4.26,<1; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')"]

[project.scripts]
wr = "worth_reaching.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
