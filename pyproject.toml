[project]
name = "worth-reaching"
version = "0.1.0"
description = "Experiments on learned latent goals for long-horizon planning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
grid = ["flax>=0.12,<1"]
ogbench = ["ogbench==1.1.5", "mujoco==3.3.7", "flax>=0.12,<1"]
scene-warp = ["mujoco-mjx[warp]==3.3.7; sys_platform == 'linux' and platform_machine == 'x86_64'"]
pointmaze = ["gymnasium-robotics==1.4.2", "minari[hdf5,hf]==0.5.4", "mujoco==3.3.7", "flax>=0.12,<1"]
training = ["lightning>=2.6,<3", "torch>=2.12,<3", "torchdata>=0.11,<1"]
training-cpu = ["lightning>=2.6,<3", "torch>=2.12,<3", "torchdata>=0.11,<1"]

[tool.uv]
conflicts = [[{ extra = "training" }, { extra = "training-cpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cuda", extra = "training", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", extra = "training-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
wr = "worth_reaching.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
